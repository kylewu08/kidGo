# 建映像並推到 GHCR（ADR-0015、ADR-0023）
#
# 曾短暫改推 Docker Hub（ADR-0022），但 ADR-0023 把映像改成**公開**之後，
# 拉取完全不需要憑證，Synology 那個限制就繞不到我們了——
# 於是回到 GHCR，與 01、07 用同一套。
#
# **公開的是映像，不是 repo。** 多階段建置讓最終映像不含原始碼，
# docs/ 底下的設計架構書與 ADR 仍然是私有的。
#
# 在 GitHub 上建、不在 NAS 上建：NAS 的 CPU 很慢，而且靠 layer 快取，
# 之後只改程式碼時 NAS 通常只需下載幾十 KB。

name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ⚠️ repo 名是 kidGo（大寫 G），但 **Docker tag 必須全小寫**。
      # 用 tr 而不是 bash 的 ${VAR,,}：後者要 bash 4+，
      # runner 上有但 macOS 內建的 bash 3.2 沒有，本機驗證會假失敗。
      - name: 產生小寫的映像名稱
        id: image
        run: |
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 多數 Synology 是 Intel/AMD。ARM 機種（Realtek / Marvell）
          # 要改成 linux/arm64——在 NAS 上跑 uname -m 可確認，x86_64 → amd64。
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
