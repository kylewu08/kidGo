# 建映像並推到 GHCR（ADR-0015）
#
# 在 GitHub 上建、不在 NAS 上建：NAS 的 CPU 很慢，而且靠 layer 快取，
# 之後只改程式碼時 NAS 通常只需下載幾十 KB。

name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ⚠️ repo 名是 kidGo（大寫 G），但 **Docker tag 必須全小寫**。
      # 直接用 ${{ github.repository }} 會產生
      # `ghcr.io/kylewu08/kidGo:latest`，push 時被 registry 拒絕，
      # 而錯誤訊息只會說 invalid reference format，不會提到大小寫。
      #
      # 用 tr 而不是 bash 的 ${VAR,,}：後者要 bash 4+，
      # runner 上有但 macOS 內建的 bash 3.2 沒有，本機驗證時會假失敗。
      - name: 產生小寫的映像名稱
        id: image
        run: |
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 多數 Synology 是 Intel/AMD。ARM 機種（Realtek / Marvell）
          # 要改成 linux/arm64——在 NAS 上跑 uname -m 可確認，x86_64 → amd64。
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
