# 建映像並推到 Docker Hub（ADR-0015、ADR-0022）
#
# 原本推 GHCR，2026-08-31 改推 Docker Hub——理由見 ADR-0022：
# Synology Container Manager 的「登錄檔」憑證不會傳給 docker compose，
# 而繞過它的兩條路（SSH 登入、公開映像）當下都走不通。
#
# 在 GitHub 上建、不在 NAS 上建：NAS 的 CPU 很慢，而且靠 layer 快取，
# 之後只改程式碼時 NAS 通常只需下載幾十 KB。

name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # ⚠️ Docker Hub 的帳號與 GitHub 的是兩回事，這裡填的是 Docker Hub 那個。
  # 映像名稱必須全小寫（repo 叫 kidGo，但 tag 不接受大寫）。
  IMAGE: kylewu08/kidgo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 多數 Synology 是 Intel/AMD。ARM 機種（Realtek / Marvell）
          # 要改成 linux/arm64——在 NAS 上跑 uname -m 可確認，x86_64 → amd64。
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
